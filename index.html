<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <audio id="bg-music" src="song/happy.mp3" loop></audio>

    <div class="container py-4">

        <div class="row">
            <div class="col-12 text-center">
                <h1 class="fade-in">Happy Birthday, Happiness!</h1>

                <img class="avatar pop-in img-fluid" src="images/passport.png">
            
                <h3 class="bday-age">+ 1</h3>
                <h4 class="bday-date">04 / 12 / 2025</h4>

                <button class="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
            </div>
        </div>

        <!-- Love Letter -->
        <div class="row justify-content-center mt-4">
            <div class="col-12 col-md-8">
                <div class="love-letter fade-in">
                    <h2>A Little Message For You ❤️</h2>
                    <p id="typed-text"></p>
                </div>
            </div>
        </div>

        <!-- Gifts Section -->
        <div class="row mt-4">

            <div class="col-12 text-center mb-4">
                <h2 class="gift-title">How I React When You Walk In</h2>
                <div class="gift-image gift-one mx-auto"></div>
            </div>

            <div class="col-12 text-center mb-4">
                <h2 class="gift-title">Your Smile Is My Favorite View</h2>
                <div class="gift-image gift-two mx-auto"></div>
            </div>

            <div class="col-12 text-center mb-4">
                <h2 class="gift-title">The Way My Heart Beats When I See You ❤️</h2>
                <div class="gift-image gift-four mx-auto"></div>
            </div>

            <div class="col-12 text-center mb-4">
                <h2 class="gift-title">If You Could See Yourself Through My Eyes… ✨</h2>
                <div class="gift-image gift-five mx-auto"></div>
            </div>

            <div class="col-12 text-center mb-4">
                <h2 class="gift-title">This is what I have for you today</h2>
                <div class="gift-image gift-three mx-auto"></div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
